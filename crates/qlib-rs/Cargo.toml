[package]
name = "qlib-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "qlib_rs"
crate-type = ["cdylib"]

[dependencies]
alpha158-core = { path = "../alpha158-core" }
alpha158-data = { path = "../alpha158-data" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.16"
rayon = { workspace = true }
